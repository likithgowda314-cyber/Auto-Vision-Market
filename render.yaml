services:
  - type: web
    name: autoprice-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node init_db.js && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autoprice-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: autoprice-ai
    env: python
    plan: free
    rootDir: ai
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

databases:
  - name: autoprice-db
    plan: free
